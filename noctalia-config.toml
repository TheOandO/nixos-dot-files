[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.80000000000000004
    center = [ "workspaces" ]
    end = [ "tray", "group:g1", "battery", "date", "notifications" ]
    margin_edge = 0
    margin_ends = 13
    panel_overlap = 2
    position = "right"
    radius_bottom_right = 0
    radius_top_right = 0
    start = [ "audio_visualizer", "group:g2" ]
    widget_spacing = 9

        [[bar.main.capsule_group]]
        fill = "surface_variant"
        id = "g2"
        members = [ "cpu", "ram" ]
        opacity = 0.25
        padding = 6.0

        [[bar.main.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "network", "bluetooth", "volume" ]
        opacity = 0.30000001192092896
        padding = 6.0

[desktop_widgets]
enabled = false

[hooks]
started = "noctalia msg session lock"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1810

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1800

[location]
address = "Skovde, Stockholm"
auto_locate = true

[lockscreen]
allow_empty_password = true
blur_intensity = 0.79999998211860657
fingerprint = false
wallpaper = "/home/matty/Pictures/Wallpapers/max-suleimanov-dv-202.sync-conflict-20260613-201032-ON5JSGN.jpg"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 64.0
    box_width = 448.0
    cx = 288.0
    cy = 544.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 7.0
        input_opacity = 1.0
        input_radius = 7.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 96.0
    box_width = 320.0
    cx = 192.0
    cy = 400.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
        background_padding = 0.0
        background_radius = 10.0
        format = "{:%H:%M}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 48.0
    box_width = 320.0
    cx = 192.0
    cy = 464.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background_opacity = 0.0
        background_padding = 8.0
        background_radius = 6.0
        clock_style = "digital"
        format = "{:%a, %d-%m-%Y}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 80.0
    box_width = 192.0
    cx = 1408.0
    cy = 440.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background_opacity = 0.0
        background_padding = 0.0

[nightlight]
enabled = true

[notification]
background_opacity = 0.69999998435378075
position = "top_left"

[osd]
background_opacity = 0.79999998211860657
orientation = "vertical"
position_vertical = "center_right"
scale = 0.90000000596046448

    [osd.kinds]
    bluetooth = false
    caffeine = false
    keyboard_layout = false
    lock_keys = false
    wifi = false

[[plugins.source]]
auto_update = true
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
auto_update = true
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[shell]
font_family = "Liberation Mono"
polkit_agent = true
settings_show_advanced = true

    [shell.animation]
    speed = 1.4500000216066837

    [shell.panel]
    clipboard_placement = "attached"
    launcher_categories = false
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "centered"
    shadow = false
    wallpaper_placement = "centered"

    [shell.screen_corners]
    size = 20

[theme]
builtin = "Catppuccin"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "zen-browser", "obsidian", "vscode" ]

[wallpaper]
directory = "/home/matty/Pictures/Wallpapers"
transition_duration = 600

    [wallpaper.default]
    path = "/home/matty/Pictures/Wallpapers/max-suleimanov-dv-202.sync-conflict-20260613-201032-ON5JSGN.jpg"

    [wallpaper.last]
    path = "/home/matty/Pictures/Wallpapers/max-suleimanov-dv-202.sync-conflict-20260613-201032-ON5JSGN.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/matty/Pictures/Wallpapers/max-suleimanov-dv-202.sync-conflict-20260613-201032-ON5JSGN.jpg"

[widget.audio_visualizer]
show_when_idle = true
width = 95.0

[widget.battery]
display_mode = "graphic"
scale = 0.90000000000000013
show_label = false

[widget.bluetooth]
scale = 1.2

[widget.clock]
format = "{:%H:%M}\\n_"

[widget.cpu]
show_label = false

[widget.date]
format = "{:%I\\n%M\\n%p}"

[widget.network]
scale = 1.1000000000000001
show_label = false

[widget.notifications]
capsule_fill = "tertiary"

[widget.output_volume]
show_label = false

[widget.ram]
show_label = false

[widget.volume]
scale = 0.94999999999999996
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
display = "none"
