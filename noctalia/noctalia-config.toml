[bar]
order = [ "default", "Workspace" ]

    [bar.Workspace]
    auto_hide = true
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.4999999888241291
    capsule_padding = 8.0
    capsule_radius = 2
    capsule_thickness = 0.89999998360872269
    center = [ "workspaces", "wallhaven_2" ]
    enabled = true
    end = []
    margin_edge = 0
    position = "left"
    radius = 2
    reserve_space = false
    shadow = false
    start = []

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_border = "on_surface"
    capsule_opacity = 0.4999999888241291
    capsule_padding = 8.0
    capsule_radius = 2
    capsule_thickness = 0.79999998584389687
    center = [ "active_window" ]
    end = [ "group:g1", "group:g4", "group:g6", "group:g7" ]
    margin_edge = 2
    margin_ends = 0
    padding = 10
    panel_overlap = 2
    radius = 2
    radius_top_left = 0
    radius_top_right = 0
    start = [ "group:g2", "group:g3" ]
    thickness = 36

        [[bar.default.capsule_group]]
        border = "on_surface"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "volume", "network", "bluetooth" ]
        opacity = 0.5
        padding = 8.0

        [[bar.default.capsule_group]]
        border = "on_surface"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "cpu", "ram", "power_profile" ]
        opacity = 0.5
        padding = 10.0

        [[bar.default.capsule_group]]
        border = "on_surface"
        enabled = true
        fill = "surface_variant"
        id = "g6"
        members = [ "weather", "date" ]
        opacity = 0.5
        padding = 10.0

        [[bar.default.capsule_group]]
        border = "on_surface"
        enabled = true
        fill = "surface_variant"
        id = "g7"
        members = [ "notifications" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        border = "on_surface"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "audio_visualizer", "media", "cat" ]
        opacity = 0.5
        padding = 8.0

        [[bar.default.capsule_group]]
        border = "on_surface"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "tray", "privacy" ]
        opacity = 0.5
        padding = 8.0
        radius = 4.0

[control_center]
hidden_tabs = [ "screen-time" ]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.79999998211860657
enabled = true
icon_size = 35
launcher_position = "start"
magnification_scale = 1.1500000022351742
main_axis_padding = 8
pinned = [ "zen", "kitty", "com.github.th_ch.youtube_music" ]
radius = 12
reserve_space = false
shadow = false
show_dots = true

[hooks]
started = "/etc/nixos/sync-repos.sh"

[hot_corners]
enabled = true

    [hot_corners.top_left]
    action = "launcher"

    [hot_corners.top_right]
    action = "control_center"

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-6" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-6"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "DP-6"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-6".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.79999998211860657

[osd]
background_opacity = 0.79999998211860657
offset_y = 14

    [osd.kinds]
    bluetooth = false
    brightness = false
    caffeine = false
    keyboard_layout = false
    lock_keys = false
    media = false
    wifi = false

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
browser_position = "center"
download_dir = ""

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/wallhaven" ]

[shell]
corner_radius_scale = 0.70000001043081284
font_family = "DepartureMono Nerd Font Mono"
polkit_agent = true
settings_show_advanced = true

    [shell.launcher]
    categories = false
    session_search = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [ "zen-browser", "obsidian" ]

[wallpaper]
directory = "/home/matty/Pictures/Wallpaper"

    [wallpaper.default]
    path = "/home/matty/Pictures/Wallpaper/wallhaven-458951.png"

    [wallpaper.last]
    path = "/home/matty/Pictures/Wallpaper/wallhaven-458951.png"

    [wallpaper.monitors.DP-3]
    path = "/home/matty/Pictures/Wallpaper/wallhaven-458951.png"

    [wallpaper.monitors.DP-6]
    path = "/home/matty/Pictures/Wallpaper/max-suleimanov-dv-202.jpg"

[widget.active_window]
anchor = true
icon_size = 16
max_length = 360
min_length = 170
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 51
color_1 = "error"
color_2 = "on_error"
mirrored = false
show_when_idle = true
width = 100

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.cpu]
show_label = false

[widget.date]
format = "{:%a • %-I:%M %p}"

[widget.media]
hide_album_art = true
max_length = 170
title_scroll = "always"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.ram]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.wallhaven_2]
glyph = "zzz"
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
show_condition = false
show_temperature = false

[widget.workspaces]
active_pill_size = 3.1000000000000001
anchor = true
display = "none"
empty_color = "on_primary"
inactive_pill_size = 1.4000000000000001
occupied_color = "tertiary"
